appId: com.jackparsonsuk.jdb
productName: JDB
directories:
  output: dist
files:
  - out/**
  - package.json
  # The window icon, which the main process loads from here.
  - resources/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  # Pinned to the id derived from the old appId (com.activategroup.jdb), so existing installs upgrade in place.
  guid: 4d324775-1d91-5185-8204-0843849efc55
  oneClick: false
  allowToChangeInstallationDirectory: true
# Installed apps check GitHub Releases for updates (electron-updater); `npm run release` publishes there.
publish:
  provider: github
  owner: jackparsonsUK
  repo: jdb
  # Publish straight away rather than as a draft, so installs pick it up without a trip to GitHub.
  releaseType: release
