appId: com.jackparsonsuk.jdb
productName: JDB
directories:
  output: dist
files:
  - out/**
  - package.json
  # The window icon, which the main process loads from here.
  - resources/**
win:
  target: nsis
  icon: build/icon.ico
nsis:
  # Pinned to the id derived from an earlier appId, so existing installs upgrade in place.
  guid: 4d324775-1d91-5185-8204-0843849efc55
  oneClick: false
  allowToChangeInstallationDirectory: true
# Installers go to a public releases-only repo (the source repo is private). Installed apps check its
# releases for updates (electron-updater), and `npm run release` publishes there.
publish:
  provider: github
  owner: jackparsonsUK
  repo: jdb-releases
  # Uploaded as a draft; scripts/release.mjs creates it first and publishes it once every file is there.
  releaseType: draft
