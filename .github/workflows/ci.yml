# Typecheck and tests on every pull request and on pushes to main and feature branches.
# Releases are built separately by release.yml, from v* tags.
name: CI

on:
  pull_request:
  push:
    branches: [main, 'feature/**', 'fix/**']

permissions:
  contents: read

jobs:
  check:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run typecheck
      - run: npm test
