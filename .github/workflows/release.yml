# Builds and publishes a release when a version tag is pushed (git tag v0.5.6 && git push origin v0.5.6).
# The installer goes to the public jdb-releases repo, so this needs the RELEASES_TOKEN secret: a
# fine-grained token with Contents read/write on jdb-releases. See RELEASE.md.
name: Release

on:
  push:
    tags: ['v*']

# One release at a time; a second tag waits rather than racing the first.
concurrency: release

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches package.json
        shell: bash
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $version"
            exit 1
          fi

      - run: npm ci
      - run: npm run typecheck
      - run: npm test

      - name: Build and publish
        run: npm run release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
